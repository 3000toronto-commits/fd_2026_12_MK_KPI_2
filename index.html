const app=document.getElementById('kpi2-app');
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(type)=>({production:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 28V12l9 5V9l9 5V5h7v23H3Z"/><path d="M8 22h2m5 0h2m5 0h2"/></svg>',wholesale:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 28V10l13-6 13 6v18H3Z"/><path d="M3 11h26M10 28V17h12v11M15 17v11"/></svg>',retail:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M5 13V28h22V13M3 13l3-9h20l3 9M3 13c0 5 6 5 6 0 0 5 7 5 7 0 0 5 7 5 7 0 0 5 6 5 6 0M11 28V19h10v9"/></svg>'})[type];
const chevron='<svg class="kpi2-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const n=(v)=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(v);
const rate=(a)=>(a.curr/a.prev-1)*100;
const scenario=()=>raw[state.industry];
const sel=(id)=>state.answers[id]||[];
const allChecked=()=>scenario().articles.every(a=>state.checked[a.id]);
function btn(text,action,kind='primary',disabled=false){return `<button class="kpi2-btn kpi2-btn-${kind}" type="button" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;}
function foot(inner){return `<div class="kpi2-foot">${inner}</div>`;}
function frame(content){const steps=2;return `<div class="kpi2-shell"><div class="kpi2-top"><div class="kpi2-brand"><span class="kpi2-brandmark">KPI</span><span>ОТ P&L К KPI · ПРАКТИКУМ</span></div><span class="kpi2-step">Шаг ${state.screen} из ${steps}</span></div><div class="kpi2-progress" aria-hidden="true"><div class="kpi2-progress-fill" style="width:${state.screen/steps*100}%"></div></div><section class="kpi2-panel">${content}</section></div>`;}
function screen1(){return `<p class="kpi2-overline">Упражнение 2 · Выбор KPI</p><h1 class="kpi2-title">Для какой компании вы подберете KPI?</h1><p class="kpi2-lead">Выберите отрасль. Мы уже определили три приоритетные статьи расходов для каждой компании — вам предстоит выбрать показатели эффективности.</p><div class="kpi2-industry-grid">${['production','wholesale','retail'].map(id=>`<button type="button" class="kpi2-industry" data-action="industry" data-id="${id}" aria-pressed="${state.industry===id}">${icon(id)}<span>${escapeHtml(raw[id].name)}</span></button>`).join('')}</div><div class="kpi2-note"><strong>Как устроено задание.</strong> Вы изучите драйверы трех статей и подберете для каждой два-три KPI. Данные и суммы расходов — условные учебные примеры из первого упражнения.</div>${foot(btn('Продолжить','next','primary',!state.industry))}`;}
function metric(label,value){return `<div class="kpi2-metric"><div class="kpi2-metric-label">${escapeHtml(label)}</div><div class="kpi2-metric-value">+${n(value)}%</div></div>`;}
function row(a){const checked=Boolean(state.checked[a.id]);const open=state.opened===a.id;const count=sel(a.id).length;const status=checked?'Проверено':count?'Выбрано '+count+' из 3':'KPI не выбраны';return `<tr class="kpi2-table-row"><td><button class="kpi2-article-button" data-action="toggle" data-id="${a.id}" aria-expanded="${open}" aria-controls="kpi2-expanded-${a.id}">${chevron}<span>${escapeHtml(a.name)}</span></button></td><td class="kpi2-numeric">${n(a.curr)}</td><td class="kpi2-numeric">+${n(rate(a))}%</td><td><span class="kpi2-state" data-kind="${checked?'checked':count?'editing':'empty'}">${status}</span></td></tr>${open?`<tr><td colspan="4" class="kpi2-expanded-td"><div id="kpi2-expanded-${a.id}" class="kpi2-expanded">${expanded(a)}</div></td></tr>`:''}`;}
function expanded(a){const selected=sel(a.id);const checked=Boolean(state.checked[a.id]);const tooMany=selected.length>=3;const options=a.kpis.map(k=>`<label class="kpi2-choice"><input type="checkbox" data-action="kpi" data-article="${a.id}" value="${k.id}" ${selected.includes(k.id)?'checked':''} ${tooMany&&!selected.includes(k.id)?'disabled':''}><span class="kpi2-choice-face">${escapeHtml(k.name)}</span></label>`).join('');return `<div class="kpi2-driver-box"><p class="kpi2-driver-title">Что формирует расходы</p><p class="kpi2-driver-text">${escapeHtml(a.drivers)}</p></div><h3 class="kpi2-section-title">Какие KPI позволят оценить эффективность?</h3><p class="kpi2-section-sub">Выберите два или три показателя. Среди вариантов есть драйверы и итоговые суммы, которые не заменяют KPI эффективности.</p><div class="kpi2-options">${options}</div><div class="kpi2-counter-line"><span class="kpi2-counter" aria-live="polite">Выбрано ${selected.length} из 3 · минимум 2</span>${btn(checked?'Проверить повторно':'Проверить KPI','check','primary',selected.length<2)}</div>${state.warning===a.id?'<div class="kpi2-inline-warning">Выберите хотя бы два показателя.</div>':''}${checked?feedback(a):''}`;}
function feedback(a){const selected=sel(a.id);const chosen=a.kpis.filter(k=>selected.includes(k.id));const missed=a.kpis.filter(k=>k.recommended&&!selected.includes(k.id));const good=chosen.filter(k=>k.recommended).length;let intro=good===chosen.length&&missed.length===0?'Вы выбрали все рекомендуемые KPI.':`Подходящих показателей в вашем выборе: ${good} из ${chosen.length}. Ниже — объяснения по каждому варианту и пропущенным KPI.`;const lines=[...chosen.map(k=>({k,kind:k.recommended?'good':'other',prefix:k.recommended?'Подходит':'Менее подходящий'})),...missed.map(k=>({k,kind:'missed',prefix:'Стоило рассмотреть'}))];return `<div class="kpi2-feedback" aria-live="polite"><h3>Разбор выбора</h3><p class="kpi2-muted">${intro}</p><div class="kpi2-feedback-list">${lines.map(({k,kind,prefix})=>`<div class="kpi2-feedback-item" data-kind="${kind}"><strong>${prefix}: ${escapeHtml(k.name)}</strong>${escapeHtml(k.explanation)}</div>`).join('')}</div></div>`;}
function screen2(){const s=scenario();const checked=s.articles.filter(a=>state.checked[a.id]).length;return `<p class="kpi2-overline">${escapeHtml(s.short)} · три приоритетные статьи</p><h1 class="kpi2-title">Какие показатели помогут управлять расходами?</h1><p class="kpi2-lead">Раскройте строку статьи, изучите драйверы и отметьте два-три KPI. Проверьте выбор по каждой из трех статей. Объяснения появятся прямо под выбранными KPI.</p><div class="kpi2-table-box"><table class="kpi2-table"><thead><tr><th scope="col">Статья P&L</th><th scope="col" class="kpi2-numeric">2026, млн ₽</th><th scope="col" class="kpi2-numeric">Рост</th><th scope="col">Статус</th></tr></thead><tbody>${s.articles.map(row).join('')}</tbody></table></div><div class="kpi2-footer-progress" aria-live="polite">Проверено ${checked} из 3 статей</div><div class="kpi2-mini-help">Цифры относятся к условной модели первого упражнения. Показатели эффективности в этом задании — учебные варианты, а не норматив для всех компаний.</div>${allChecked()?`<div class="kpi2-summary"><strong>Главный вывод.</strong> Для каждой статьи достаточно двух-трех ключевых KPI, которые помогают оценивать эффективность использования ресурсов и принимать решения. У показателя должен быть владелец, способный влиять на результат. После внедрения KPI необходимо задать целевые значения и регулярно контролировать отклонения.</div>`:""}${foot(btn('Назад','back','ghost')+(allChecked()?btn('Пройти заново','restart','secondary'):""))}`;}
function render(focusTarget){app.innerHTML=frame(state.screen===1?screen1():screen2());if(focusTarget){const el=app.querySelector(focusTarget);if(el)el.focus({preventScroll:true});}}
function reset(){state.screen=1;state.industry=null;state.opened=null;state.answers={};state.checked={};state.warning=null;render();window.scrollTo({top:0,behavior:'instant'});}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;
 if(action==='industry'){state.industry=id;state.opened=null;state.answers={};state.checked={};state.warning=null;render(`[data-action="industry"][data-id="${id}"]`);}
 if(action==='next'){if(state.screen===1&&state.industry){state.screen=2;state.opened=scenario().articles[0].id;render();window.scrollTo(0,0);}}
 if(action==='back'){state.screen=1;render();window.scrollTo(0,0);}
 if(action==='toggle'){state.opened=state.opened===id?null:id;state.warning=null;render(`[data-action="toggle"][data-id="${id}"]`);}
 if(action==='check'){const a=scenario().articles.find(x=>x.id===state.opened);if(!a)return;if(sel(a.id).length<2){state.warning=a.id;render();return;}state.checked[a.id]=true;state.warning=null;render(`[data-action="check"]`);}
 if(action==='restart')reset();
});
app.addEventListener('change',e=>{const input=e.target.closest('input[data-action="kpi"]');if(!input)return;const id=input.dataset.article;const list=state.answers[id]||[];if(input.checked){if(list.length<3)state.answers[id]=[...list,input.value];else input.checked=false;}else{state.answers[id]=list.filter(v=>v!==input.value);}delete state.checked[id];state.warning=null;const oldScroll=window.scrollY;const targetId=input.value;render(`input[value="${targetId}"]`);window.scrollTo(0,oldScroll);});
// Optional, validated initial state for embedding; no completion event is emitted.
// Example: window.KPI2_INITIAL = {industry:'retail'} before this script runs.
try{const init=window.KPI2_INITIAL;if(init&&raw[init.industry])state.industry=init.industry;}catch(e){}
render();
})();
</script>
</body>
</html>
